<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Story — Greygate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{ font-family:'Utendo'; src:url('../assets/fonts/Utendo-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'Utendo'; src:url('../assets/fonts/Utendo-Bold.ttf') format('truetype'); font-weight:700; font-display:swap; }
  :root{
    --void:#000000; --ink:#e8e6e2; --ink-dim:#8a8a8d;
    --ember:#ff8a4c; --ember-soft:#ffbf8f;
    --font-display:'Orbitron', sans-serif; --font-body:'Utendo', sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--void); color:var(--ink); font-family:var(--font-body); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--ember); color:#050505; }
  a{ color:inherit; }
  /* ---------- ambient vanta-black backdrop, flat, no gradients ---------- */
  #bg-canvas{ position:fixed; inset:0; z-index:-2; width:100%; height:100%; background:var(--void); }
  #bg-vignette{ position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--void); }
  .site-nav{ position:fixed; top:0; left:0; z-index:60; padding:26px 0 0 calc(28px + 5mm); }
  .site-nav img{ height:26px; width:auto; opacity:0.95; }
  main{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:14vh calc(2vw + 5mm) 8vh; }
  .wrap{ max-width:1180px; width:100%; }
  .crumb{ font-size:0.95rem; color:var(--ink-dim); margin-bottom:26px; }
  .crumb a{ color:var(--ink-dim); text-decoration:none; border-bottom:1px solid rgba(232,230,226,0.25); }
  .crumb a:hover{ color:var(--ink); border-color:var(--ink); }
  .index-tag{ font-family:var(--font-body); font-weight:700; font-size:0.95rem; color:var(--ember-soft); letter-spacing:0.04em; margin-bottom:18px; }
  h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(2.8rem, 6.4vw, 5rem); line-height:1.1; letter-spacing:0.005em; margin:0 0 26px; }
  .lede{ font-size:1.5rem; color:var(--ink); line-height:1.5; margin:0 0 22px; font-weight:700; font-family:var(--font-body); }
  .body-copy{ font-size:1.28rem; color:var(--ink-dim); line-height:1.65; margin:0 0 52px; max-width:820px; }
  .cta{ position:relative; display:inline-flex; align-items:center; gap:14px; padding:19px 32px 19px 28px; border-radius:999px;
    border:1px solid rgba(232,230,226,0.18); background:linear-gradient(90deg, rgba(20,20,21,0.9), rgba(20,17,15,0.9));
    color:var(--ink); font-family:var(--font-body); font-size:1.15rem; font-weight:400; text-decoration:none; overflow:hidden;
    transition: border-color .35s ease, transform .25s ease; }
  .cta::before{ content:""; position:absolute; inset:0; background: radial-gradient(60% 140% at 100% 50%, rgba(255,138,76,0.5), transparent 70%); opacity:0.5; transition:opacity .35s ease; }
  .cta span, .cta svg{ position:relative; z-index:1; }
  .cta:hover{ border-color:rgba(255,191,143,0.55); transform:translateY(-1px); }
  .cta:hover::before{ opacity:0.85; }
  .next-row{ margin-top:64px; padding-top:30px; border-top:1px solid rgba(232,230,226,0.12);
    display:flex; align-items:baseline; gap:12px; font-size:1.08rem; color:var(--ink-dim); }
  .next-row a{ color:var(--ink); text-decoration:none; font-family:var(--font-body); font-weight:700; }
  .next-row a:hover{ color:var(--ember-soft); }

  /* ---- work gallery (Space Optimization only) ---- */
  .gallery-section{ margin-top:8px; }
  .gallery-caption{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; line-height:1.32; letter-spacing:0.002em; color:var(--ink); margin:0 0 16px; max-width:640px; }
  .gallery-intro{ font-size:1rem; color:var(--ink-dim); line-height:1.72; margin:0 0 34px; max-width:620px; }
  .masonry-container{ position:relative; width:100%; }
  .item-wrapper{ position:absolute; top:0; left:0; will-change:transform,width,height,opacity; cursor:pointer; }
  .item-media{ position:relative; width:100%; height:100%; border-radius:5px; overflow:hidden; background:#0d0d0e;
    box-shadow:0 14px 40px -14px rgba(0,0,0,0.55); }
  .item-media video{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-caption-overlay{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding:10px 12px 10px;
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.8)); pointer-events:none; }
  .g-title{ font-family:var(--font-display); font-weight:600; font-size:0.82rem; color:var(--ink); letter-spacing:0.005em; }
  .g-year{ font-family:var(--font-body); font-size:0.7rem; color:var(--ink-dim); flex-shrink:0; }
  .g-play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.85); z-index:2;
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(90deg, rgba(20,20,21,0.85), rgba(20,17,15,0.85)); border:1px solid rgba(232,230,226,0.22);
    color:var(--ink); opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none; }
  .item-wrapper:hover .g-play{ opacity:0.92; transform:translate(-50%,-50%) scale(1); }

  .lightbox{ position:fixed; inset:0; z-index:150; background:rgba(3,3,3,0.94);
    display:none; align-items:center; justify-content:center; padding:6vh 4vw; }
  .lightbox.open{ display:flex; }
  .lightbox video{ max-width:min(92vw, 1100px); max-height:88vh; width:100%; border-radius:4px; background:#000; }
  .lightbox-close{ position:absolute; top:24px; right:26px; width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:rgba(20,20,21,0.85);
    border:1px solid rgba(232,230,226,0.2); color:var(--ink); cursor:pointer; }

  /* ---- Brand Story page ---- */
  .story-caption{ font-family:var(--font-display); font-weight:700; font-size:clamp(1.9rem, 2.6vw, 2.3rem); line-height:1.28; color:var(--ink); margin:0 0 16px; max-width:920px; }
  .story-subtext{ font-size:1.28rem; color:var(--ink-dim); line-height:1.6; margin:0 0 38px; max-width:900px; }
  .story-video{ position:relative; width:100%; max-width:1180px; aspect-ratio:16/9; border-radius:8px; overflow:hidden;
    background:#0d0d0e; border:1px solid rgba(232,230,226,0.1); box-shadow:0 20px 60px -20px rgba(0,0,0,0.6); }
  .story-video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .story-video-poster{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.7); }
  .story-video-play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:82px; height:82px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(90deg, rgba(20,20,21,0.9), rgba(20,17,15,0.9));
    border:1px solid rgba(232,230,226,0.25); color:var(--ink); cursor:pointer;
    box-shadow:0 12px 40px -8px rgba(0,0,0,0.6); transition:transform .25s ease, border-color .25s ease; }
  .story-video-play::before{ content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(70% 140% at 100% 50%, rgba(255,138,76,0.55), transparent 70%); opacity:0.6; }
  .story-video-play svg{ position:relative; z-index:1; margin-left:4px; width:24px; height:24px; }
  .story-video-play:hover{ transform:translate(-50%,-50%) scale(1.06); border-color:rgba(255,191,143,0.55); }
  .story-credit{ font-size:1.02rem; color:var(--ink-dim); margin:18px 0 40px; }
  .story-credit a{ color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(232,230,226,0.3); }
  .story-credit a:hover{ color:var(--ember-soft); border-color:var(--ember-soft); }
  .story-cta{ margin-bottom:10px; }

  @media (max-width:900px){ .item-wrapper{ } }
  @media (max-width:640px){ .site-nav{ padding:20px 0 0 calc(18px + 5mm); } main{ padding:13vh calc(5vw + 5mm) 8vh; } .gallery-caption{ font-size:1.25rem; } h1{ font-size:clamp(2.1rem,9vw,2.8rem); } .story-caption{ font-size:1.5rem; } }
</style>
<style>
/* Shared top-right menu — g-icon that morphs into a 3-line trigger,
   opening a full-height slide-out panel. Used on every page. */

.nav-toggle{
  position:fixed; top:20px; right:calc(24px + 5mm); z-index:110;
  width:50px; height:50px;
  border-radius:50%;
  border:1px solid rgba(232,230,226,0.16);
  background:rgba(13,13,14,0.88);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.nav-toggle-icon{
  position:relative; width:22px; height:22px;
}
.nav-toggle-g, .nav-toggle-lines{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  transition: opacity .38s cubic-bezier(.4,0,.2,1), transform .38s cubic-bezier(.4,0,.2,1);
}
.nav-toggle-g img{ width:22px; height:22px; display:block; }
.nav-toggle-lines{
  flex-direction:column; justify-content:center; gap:4px;
  opacity:0; transform:scale(0.55) rotate(-30deg);
}
.nav-toggle-lines span{
  display:block; width:19px; height:1.6px; background:var(--ink);
  transition: transform .38s cubic-bezier(.4,0,.2,1);
}
.nav-toggle.is-open .nav-toggle-g{ opacity:0; transform:scale(0.55) rotate(30deg); }
.nav-toggle.is-open .nav-toggle-lines{ opacity:1; transform:scale(1) rotate(0deg); }

@media (hover:hover){
  .nav-toggle:not(.is-open):hover .nav-toggle-g{ opacity:0; transform:scale(0.55) rotate(30deg); }
  .nav-toggle:not(.is-open):hover .nav-toggle-lines{ opacity:1; transform:scale(1) rotate(0deg); }
}
.nav-toggle.is-open .nav-toggle-lines span:nth-child(1){ transform:translateY(5.6px) rotate(45deg); }
.nav-toggle.is-open .nav-toggle-lines span:nth-child(2){ opacity:0; }
.nav-toggle.is-open .nav-toggle-lines span:nth-child(3){ transform:translateY(-5.6px) rotate(-45deg); }

.nav-backdrop{
  position:fixed; inset:0; z-index:100;
  background:rgba(3,3,3,0.55);
  opacity:0; pointer-events:none;
  transition:opacity .4s ease;
}
.nav-backdrop.is-open{ opacity:1; pointer-events:auto; }

.nav-panel{
  position:fixed; top:0; right:0; bottom:0; z-index:105;
  width:min(88vw, 420px);
  background:#0b0b0c;
  border-left:1px solid rgba(232,230,226,0.1);
  transform:translateX(100%);
  transition:transform .5s cubic-bezier(.16,.84,.44,1);
  display:flex; flex-direction:column;
  justify-content:flex-start;
  overflow-y:auto;
  padding:max(16vh, 110px) calc(10vw + 5mm) 6vh;
}
.nav-panel.is-open{ transform:translateX(0); }
.nav-panel a{
  display:block;
  font-family:'Orbitron', sans-serif;
  font-weight:600;
  font-size:clamp(1.6rem, 5vw, 2.3rem);
  letter-spacing:0.005em;
  color:var(--ink, #e8e6e2);
  text-decoration:none;
  padding:14px 0;
  border-bottom:1px solid rgba(232,230,226,0.08);
  opacity:0;
  transform:translateY(16px);
  transition:opacity .5s ease, transform .5s ease, color .25s ease;
}
.nav-panel.is-open a{ opacity:1; transform:translateY(0); }
.nav-panel.is-open a:nth-child(1){ transition-delay:.12s; }
.nav-panel.is-open a:nth-child(2){ transition-delay:.18s; }
.nav-panel.is-open a:nth-child(3){ transition-delay:.24s; }
.nav-panel a:hover{ color:#ff8a4c; }
.nav-panel .nav-foot{
  margin-top:34px;
  font-family:'Utendo', sans-serif;
  font-size:0.82rem;
  color:#8a8a8d;
  opacity:0;
  transition:opacity .5s ease .3s;
}
.nav-panel.is-open .nav-foot{ opacity:1; }

@media (max-width:640px){
  .nav-toggle{ top:16px; right:calc(16px + 5mm); width:44px; height:44px; }
}
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="bg-vignette"></div>
  <header class="site-nav"><a href="../index.html"><img src="../assets/logo.png" alt="Greygate"></a></header>
  <main>
    <div class="wrap">
      <p class="crumb"><a href="../index.html">Greygate</a> &nbsp;/&nbsp; Services</p>
      <p class="index-tag">11 — 12</p>
      <h1>Brand Story</h1>

      <p class="story-caption">Your Brand's story is what pulls everyone in</p>
      <p class="story-subtext">Our method of Brand storytelling builds brands that take over each industry.</p>

      <div class="story-video" id="storyVideo" data-yt="5ZCJbWyLofA">
        <img class="story-video-poster" src="https://img.youtube.com/vi/5ZCJbWyLofA/hqdefault.jpg" alt="Tinashe Mupindu — Brand Story, video thumbnail">
        <button class="story-video-play" id="storyVideoPlay" aria-label="Play video">
          <svg width="24" height="24" viewBox="0 0 16 16" fill="none"><path d="M4 2.5L13 8L4 13.5V2.5Z" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="story-credit">Tinashe Mupindu's Story — <a href="https://youtu.be/5ZCJbWyLofA" target="_blank" rel="noopener">watch on YouTube ↗</a></p>

      <a class="cta story-cta" href="../contact.html">
        <span>Ready to build yours?</span>
        <span class="cta-arrow">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7H12M12 7L7.5 2.5M12 7L7.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <a class="cta" href="../index.html#duoPin">
        <span>Back to all services</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 7H2M2 7L6.5 2.5M2 7L6.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="next-row">
        <span>Next discipline</span>
        <a href="psychology.html">Psychology →</a>
      </div>
    </div>
  </main>
  <script src="../assets/ambient.js"></script>
  <script>
    (function(){
      var wrap = document.getElementById('storyVideo');
      var playBtn = document.getElementById('storyVideoPlay');
      if(!wrap || !playBtn) return;
      function play(){
        var id = wrap.dataset.yt;
        var iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
        iframe.title = 'Tinashe Mupindu — Brand Story';
        iframe.frameBorder = '0';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        wrap.innerHTML = '';
        wrap.appendChild(iframe);
      }
      playBtn.addEventListener('click', play);
      wrap.querySelector('.story-video-poster').addEventListener('click', play);
    })();
  </script>
  <script>
  (function(){
    const base = '../';

    const links = [
      { label: 'Home', href: base + 'index.html' },
      { label: 'Our Magic', href: base + 'index.html#duoPin' },
      { label: 'Hi We Here', href: base + 'contact.html' }
    ];

    const toggle = document.createElement('button');
    toggle.className = 'nav-toggle';
    toggle.setAttribute('aria-label', 'Open menu');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.innerHTML = `
      <span class="nav-toggle-icon">
        <span class="nav-toggle-g"><img src="${base}assets/logo.png" alt=""></span>
        <span class="nav-toggle-lines"><span></span><span></span><span></span></span>
      </span>`;

    const backdrop = document.createElement('div');
    backdrop.className = 'nav-backdrop';

    const panel = document.createElement('nav');
    panel.className = 'nav-panel';
    panel.innerHTML =
      links.map(l => `<a href="${l.href}">${l.label}</a>`).join('') +
      `<div class="nav-foot">Greygate — space design, turned into reality.</div>`;

    document.body.appendChild(backdrop);
    document.body.appendChild(panel);
    document.body.appendChild(toggle);

    let open = false;
    function setOpen(v){
      open = v;
      toggle.classList.toggle('is-open', open);
      backdrop.classList.toggle('is-open', open);
      panel.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      document.body.style.overflow = open ? 'hidden' : '';
    }

    toggle.addEventListener('click', () => setOpen(!open));
    backdrop.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') setOpen(false); });
  })();
  </script>
</body>
</html>
